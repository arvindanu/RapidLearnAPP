<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b13">
  <title>RapidLearn — Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#090b13;color:#f1f2f4;font-family:Arial,sans-serif;text-align:center}.card{max-width:420px;padding:36px 28px;border:1px solid rgba(185,190,199,.16);border-radius:22px;background:#15181e}.mark{width:64px;height:64px;margin:0 auto 22px;border-radius:18px;background:#580d25;display:grid;place-items:center;color:#e4e6eb;font-size:30px;font-weight:800}.muted{color:#9299a5;line-height:1.65}button{margin-top:16px;border:0;border-radius:10px;padding:12px 20px;background:#a52a4b;color:white;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">R</div>
    <h1>You're offline</h1>
    <p class="muted">RapidLearn needs an internet connection to load fresh discoveries, quizzes and AI feedback. Reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
