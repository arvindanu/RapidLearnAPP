
name: Build RapidLearn Android app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rapidlearn-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed Android APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # FIX: Explicitly request supported SDK packages.
      # Do not request the obsolete "tools" package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Install dependencies and verify Next.js production build
        run: |
          npm ci
          npm run build

      - name: Wait for the updated PWA deployment
        env:
          RAPIDLEARN_URL: ${{ vars.RAPIDLEARN_URL }}
        run: |
          test -n "$RAPIDLEARN_URL" || (echo "Set repository variable RAPIDLEARN_URL first." && exit 1)

          for attempt in $(seq 1 60); do
            if curl --fail --silent "$RAPIDLEARN_URL/manifest.webmanifest" -o /dev/null \
              && curl --fail --silent "$RAPIDLEARN_URL/icons/rapidlearn-512.png" -o /dev/null; then
              echo "The deployed RapidLearn PWA and launcher icon are available."
              exit 0
            fi

            echo "Waiting for Vercel deployment ($attempt/60)..."
            sleep 10
          done

          echo "The PWA files were not available after 10 minutes."
          exit 1

      - name: Validate Android build settings
        env:
          RAPIDLEARN_URL: ${{ vars.RAPIDLEARN_URL }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$RAPIDLEARN_URL" || (echo "Set RAPIDLEARN_URL to your public Vercel HTTPS URL." && exit 1)
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Add ANDROID_KEYSTORE_BASE64 secret." && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Add ANDROID_KEYSTORE_PASSWORD secret." && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Add ANDROID_KEY_PASSWORD secret." && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Add ANDROID_KEY_ALIAS secret." && exit 1)

      - name: Prepare Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > rapidlearn-release.keystore
          test -s rapidlearn-release.keystore

      - name: Generate Trusted Web Activity configuration
        env:
          RAPIDLEARN_URL: ${{ vars.RAPIDLEARN_URL }}
          ANDROID_PACKAGE_ID: ${{ vars.ANDROID_PACKAGE_ID }}
        run: node scripts/create-twa-manifest.mjs

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Configure Bubblewrap Android tool paths
        run: |
          mkdir -p "$HOME/.bubblewrap"
          node -e 'require("fs").writeFileSync(process.env.HOME + "/.bubblewrap/config.json", JSON.stringify({jdkPath: process.env.JAVA_HOME, androidSdkPath: process.env.ANDROID_HOME}, null, 2))'

      - name: Generate Android project
        working-directory: android
        run: bubblewrap update --skipVersionUpgrade

      - name: Build signed APK and Play Store bundle
        working-directory: android
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath="$GITHUB_WORKSPACE/rapidlearn-release.keystore" \
            --signingKeyAlias="$ANDROID_KEY_ALIAS"

      - name: Generate Digital Asset Links file
        working-directory: android
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_PACKAGE_ID: ${{ vars.ANDROID_PACKAGE_ID }}
        run: |
          FINGERPRINT=$(keytool -list -v \
            -keystore "$GITHUB_WORKSPACE/rapidlearn-release.keystore" \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            | awk -F': ' '/SHA256:/{print $2; exit}')

          test -n "$FINGERPRINT" || (echo "Could not read signing certificate SHA-256 fingerprint." && exit 1)

          CERT_FINGERPRINT="$FINGERPRINT" node -e '
            const fs = require("fs");
            const data = [{
              relation: ["delegate_permission/common.handle_all_urls"],
              target: {
                namespace: "android_app",
                package_name: process.env.ANDROID_PACKAGE_ID || "com.rapidlearn.app",
                sha256_cert_fingerprints: [process.env.CERT_FINGERPRINT]
              }
            }];
            fs.writeFileSync("assetlinks.json", JSON.stringify(data, null, 2) + "\n");
          '

          cat assetlinks.json

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rapidlearn-android-${{ github.run_number }}
          path: |
            android/app-release-signed.apk
            android/app-release-bundle.aab
            android/assetlinks.json
          if-no-files-found: error
          retention-days: 30
